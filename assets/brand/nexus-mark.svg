<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Nexus mark</title>
  <desc id="desc">Logo mark for Nexus Runtime Platform: an abstract letter N formed by four connected nodes inside a hexagon, in a blue to cyan gradient on a dark rounded square.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="1" y="1" width="254" height="254" rx="47" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="128" cy="128" r="110" fill="url(#halo)"/>

  <!-- Hexagon frame -->
  <polygon points="128,36 207.7,82 207.7,174 128,220 48.3,174 48.3,82" fill="none" stroke="url(#brand)" stroke-width="5" stroke-linejoin="round" stroke-opacity="0.9"/>

  <!-- Hexagon vertex taps -->
  <g fill="#3B82F6" fill-opacity="0.7">
    <circle cx="128" cy="36" r="4"/>
    <circle cx="128" cy="220" r="4"/>
  </g>

  <!-- Abstract N from connected nodes -->
  <g filter="url(#glow)">
    <path d="M92 170V86L164 170V86" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0B1220" stroke-width="5">
      <circle cx="92" cy="170" r="12" stroke="#2563EB"/>
      <circle cx="92" cy="86" r="12" stroke="#3B82F6"/>
      <circle cx="164" cy="170" r="12" stroke="#06B6D4"/>
      <circle cx="164" cy="86" r="12" stroke="#22D3EE"/>
    </g>
    <circle cx="164" cy="86" r="5" fill="#22D3EE"/>
  </g>
</svg>
