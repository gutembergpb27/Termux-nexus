<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS RUNTIME PLATFORM V2700</title>
  <desc id="desc">Hero banner for Nexus Runtime Platform V2700. Wordmark with a cyan V2700 badge, the tagline "From vision to engineering. From engineering to evidence.", and a constellation of connected nodes representing a modular distributed runtime.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1A2E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.79" cy="0.5" r="0.32">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="860" y1="50" x2="1180" y2="270">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3B82F6" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#22D3EE" fill-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#halo)"/>
    <!-- circuit traces -->
    <g fill="none" stroke="#3B82F6" stroke-opacity="0.16" stroke-width="1.5">
      <path d="M0 40H160L184 64H560"/>
      <path d="M0 300H220L244 276H640"/>
      <path d="M1280 24H1180L1156 48H1060"/>
    </g>
    <g fill="#22D3EE" fill-opacity="0.35">
      <circle cx="560" cy="64" r="3"/>
      <circle cx="640" cy="276" r="3"/>
      <circle cx="1060" cy="48" r="3"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="19.5" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="64" y="70" width="6" height="128" rx="3" fill="url(#accent)"/>

  <!-- Wordmark -->
  <text x="92" y="138" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="10" fill="url(#word)">NEXUS</text>

  <!-- V2700 badge -->
  <g transform="translate(456 82)">
    <rect width="108" height="40" rx="20" fill="#06B6D4" fill-opacity="0.14" stroke="#22D3EE" stroke-width="2"/>
    <text x="54" y="27" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#22D3EE">V2700</text>
  </g>

  <text x="94" y="186" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="7.5" fill="#3B82F6">RUNTIME PLATFORM</text>

  <!-- Tagline -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#E5E7EB">
    <text x="94" y="232">From vision to engineering.</text>
    <text x="94" y="260">From engineering to <tspan fill="#22D3EE" font-weight="600">evidence.</tspan></text>
  </g>

  <!-- Caption -->
  <text x="94" y="294" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#94A3B8" letter-spacing="0.5">experimental · evidence-first · MIT</text>

  <!-- Divider -->
  <line x1="780" y1="48" x2="780" y2="272" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- Node constellation -->
  <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round">
    <!-- spokes from coordinator -->
    <line x1="1015" y1="160" x2="880" y2="95"/>
    <line x1="1015" y1="160" x2="905" y2="238"/>
    <line x1="1015" y1="160" x2="1130" y2="84"/>
    <line x1="1015" y1="160" x2="1172" y2="212"/>
    <line x1="1015" y1="160" x2="1062" y2="266"/>
  </g>
  <g fill="none" stroke="#3B82F6" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="4 5">
    <!-- peer mesh -->
    <line x1="880" y1="95" x2="1000" y2="52"/>
    <line x1="1000" y1="52" x2="1130" y2="84"/>
    <line x1="1130" y1="84" x2="1172" y2="212"/>
    <line x1="1172" y1="212" x2="1062" y2="266"/>
    <line x1="1062" y1="266" x2="905" y2="238"/>
    <line x1="905" y1="238" x2="880" y2="95"/>
    <line x1="1000" y1="52" x2="1015" y2="160"/>
  </g>

  <!-- Peer nodes -->
  <g stroke-width="2.5">
    <circle cx="880" cy="95" r="11" fill="#0B1220" stroke="#3B82F6"/>
    <circle cx="905" cy="238" r="11" fill="#0B1220" stroke="#3B82F6"/>
    <circle cx="1000" cy="52" r="9" fill="#0B1220" stroke="#3B82F6"/>
    <circle cx="1130" cy="84" r="11" fill="#0B1220" stroke="#22D3EE"/>
    <circle cx="1172" cy="212" r="11" fill="#0B1220" stroke="#3B82F6"/>
    <circle cx="1062" cy="266" r="9" fill="#0B1220" stroke="#22D3EE"/>
  </g>
  <g fill="#3B82F6">
    <circle cx="880" cy="95" r="4"/>
    <circle cx="905" cy="238" r="4"/>
    <circle cx="1000" cy="52" r="3.5"/>
    <circle cx="1172" cy="212" r="4"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="1130" cy="84" r="4"/>
    <circle cx="1062" cy="266" r="3.5"/>
  </g>

  <!-- Highlighted coordinator node -->
  <g filter="url(#glow)">
    <circle cx="1015" cy="160" r="30" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="r" values="26;34;26" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0.1;0.45" dur="6s" repeatCount="indefinite"/>
    </circle>
    <polygon points="1015,140 1032.3,150 1032.3,170 1015,180 997.7,170 997.7,150" fill="#0B1220" stroke="#22D3EE" stroke-width="3"/>
    <circle cx="1015" cy="160" r="7" fill="#22D3EE"/>
  </g>
</svg>
